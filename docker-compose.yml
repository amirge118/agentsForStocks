# Full stack:            docker compose up --build
# Database only (dev):   docker compose up -d db
# With knowledge layer:  docker compose --profile knowledge up --build
# With monitoring:       OTEL_ENABLED=true in .env, then
#                        docker compose --profile observability up --build
#                        → Grafana (traces, metrics, logs, dashboard) at http://localhost:3001
#
# Settings come from .env (see .env.example). API_KEYS, BACKEND_API_KEY and
# DASHBOARD_PASSWORD are required — the containers run in production mode.

x-backend: &backend
  build: ./backend
  image: agentsforstocks-backend
  env_file:
    - path: .env
      required: false
  environment:
    # Fixed for the container topology, whatever .env (written for local dev) says:
    # the scheduler runs only in `worker`, never inside `api`.
    ENVIRONMENT: production
    RUN_SCHEDULER: "false"
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agentsforstocks}
    API_KEYS: ${API_KEYS:?Set API_KEYS in .env}
    OPENVIKING_ENABLED: ${OPENVIKING_ENABLED:-false}
    OPENVIKING_URL: http://openviking:1933
    # OpenTelemetry → the `observability` profile's collector (off unless OTEL_ENABLED=true)
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://observability:4318}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: agentsforstocks_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentsforstocks}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations, then exits. api and worker start after it succeeds.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Exactly one scheduler process (the API runs with RUN_SCHEDULER=false)
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # No HTTP port: healthy while the scheduler process (PID 1) is alive.
    # (`docker compose up --wait` rejects services whose healthcheck is disabled.)
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: agentsforstocks-frontend
    environment:
      BACKEND_URL: http://api:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY:?Set BACKEND_API_KEY in .env (one of API_KEYS)}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- optional monitoring (profile "observability") ----------------------------
  # Grafana + OpenTelemetry collector + Tempo (traces) + Loki (logs) + Prometheus
  # (metrics) in one container, with the agentsForStocks dashboard provisioned.
  # Local use only: Grafana runs with anonymous admin access, so it binds to localhost.
  observability:
    image: grafana/otel-lgtm:0.36.0
    profiles: ["observability"]
    environment:
      # The dashboard's token / cost panels query the app database (llm_calls, agent_runs)
      AFS_DB_HOST: db:5432
      AFS_DB_USER: ${POSTGRES_USER:-postgres}
      AFS_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AFS_DB_NAME: ${POSTGRES_DB:-agentsforstocks}
    ports:
      - "127.0.0.1:3001:3000" # Grafana
      - "127.0.0.1:4318:4318" # OTLP/HTTP, for a backend running on the host
    volumes:
      - ./infra/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/agentsforstocks.yaml:ro
      - ./infra/grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/agentsforstocks.yaml:ro
      - ./infra/grafana/dashboards:/otel-lgtm/agentsforstocks-dashboards:ro
      - observability_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- optional knowledge layer (profile "knowledge") --------------------------
  openviking:
    image: ghcr.io/volcengine/openviking:main
    container_name: openviking
    profiles: ["knowledge"]
    ports:
      - "1933:1933"
    volumes:
      - ./infra/openviking/ov.conf:/app/ov.conf
      - openviking_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1933/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  openviking-mcp:
    image: ghcr.io/volcengine/openviking:main
    container_name: openviking_mcp
    profiles: ["knowledge"]
    command: ["uv", "run", "mcp_server.py", "--port", "2033", "--transport", "http"]
    ports:
      - "2033:2033"
    volumes:
      - ./infra/openviking/ov.conf:/app/ov.conf
      - openviking_data:/app/data
    depends_on:
      openviking:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  openviking_data:
  observability_data:
