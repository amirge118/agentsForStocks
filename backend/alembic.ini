# Alembic configuration — the database URL comes from app settings (DATABASE_URL),
# never from this file. Run from backend/:  alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# Split path lists on os.pathsep (alembic >= 1.16 warns without an explicit choice)
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
