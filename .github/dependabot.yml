# Weekly dependency updates. Minor/patch bumps are grouped into one PR per
# ecosystem to keep the noise down; security updates always come separately.
# Every Dependabot PR goes through the same CI as any other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # Held on purpose — see FUTURE_IMPROVEMENTS.md (Dependencies); remove when unblocked
    ignore:
      - dependency-name: aiosqlite
        versions: [">=0.21"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Held on purpose — see FUTURE_IMPROVEMENTS.md (Dependencies); remove when unblocked
    ignore:
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
