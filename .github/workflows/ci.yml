name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, security, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENVIKING_ENABLED: "false"
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts alembic evals
      - name: Format (black)
        run: black --check app tests scripts alembic evals
      - name: Security scan (bandit)
        run: bandit -q -r app
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Tests (SQLite + PostgreSQL, coverage gate 80%)
        run: pytest
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    name: Frontend (types, lint, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/types/openapi.d.ts
      - name: Type-check (includes Zod ↔ OpenAPI contract checks)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Unit tests
        run: npm test -- --coverage
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # It hung twice before any test ran: fail fast instead of eating the job's 20 minutes
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: E2E tests (builds and starts the production server)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker (build images, compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test environment for compose
        run: |
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          {
            echo "API_KEYS=$KEY"
            echo "BACKEND_API_KEY=$KEY"
            echo "DASHBOARD_PASSWORD=ci-password"
            echo "WATCHLIST=AAPL,MSFT"
            echo "SCHEDULER_ENABLED=true"   # checks the jobs run in the worker, not the API
          } > .env
      - name: Optional profiles and dashboards are valid
        run: |
          docker compose --profile observability --profile knowledge --profile https --profile backup config -q
          docker run --rm -e DOMAIN=ci.example.com -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          sh -n infra/backup/backup.sh && sh -n infra/deploy/init-env.sh
          for f in infra/grafana/dashboards/*.json; do jq -e '.panels | length > 0' "$f" > /dev/null; done
      - name: Build images
        run: docker compose build
      - name: Start the stack (db → migrate → api + worker → frontend)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS localhost:8000/health | tee /dev/stderr | grep -q '"scheduler":"external"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/agents)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = 401
          curl -fsS -u admin:ci-password localhost:3000/api/backend/symbols | grep -q '"AAPL"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -u admin:ci-password \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -X POST localhost:3000/api/backend/pipeline/runs -d '{"agents":["technicals"]}')
          test "$code" = 202
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          # Nothing but the dashboard proxy may face the network: every port is on 127.0.0.1
          ! docker compose ps --format '{{.Ports}}' | grep -q '0.0.0.0'
      - name: A backup can be written and read back
        run: |
          set -euo pipefail
          docker compose --profile backup run --rm -e BACKUP_ONCE=1 backup
          dump=$(ls backups/agentsforstocks-*.sql.gz)
          gunzip -t "$dump"
          # grep reads it all (no -q): an early exit would fail the pipe with SIGPIPE
          gunzip -c "$dump" | grep 'CREATE TABLE public.agent_results' > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
