name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, security, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENVIKING_ENABLED: "false"
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts alembic
      - name: Format (black)
        run: black --check app tests scripts alembic
      - name: Security scan (bandit)
        run: bandit -q -r app
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Tests (SQLite + PostgreSQL, coverage gate 80%)
        run: pytest
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    name: Frontend (types, lint, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/types/openapi.d.ts
      - name: Type-check (includes Zod ↔ OpenAPI contract checks)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Unit tests
        run: npm test -- --coverage
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (builds and starts the production server)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
